# Site-wide settings for Junteng Liu's academic homepage

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Junteng Liu is a first-year PhD candidate at the HKUST NLP Group researching natural language processing and machine learning, including LLM reasoning and reinforcement learning, vision-language model hallucination, LLM truthfulness, and interpretability."
url                      : https://silverporterindicate.github.io
baseurl                  : "/LJT-Homepage"
repository               : "SilverPorterIndicate/LJT-Homepage"

# Site Author
# Only contact details recorded in memory are enabled.
author:
  avatar           : "https://github.com/Vicent0205.png"
  name             : "Junteng Liu"
  pronouns         :
  bio              : "First-year PhD candidate at the HKUST NLP Group researching natural language processing and machine learning."
  location         : "Hong Kong"
  employer         : "HKUST NLP Group, Hong Kong University of Science and Technology"
  uri              : "https://silverporterindicate.github.io/LJT-Homepage/"
  email            : "jliugi@connect.ust.hk"

  # Academic profiles recorded in memory
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

  # Code profile recorded in memory
  github           : "Vicent0205"

  # Social media recorded in memory (username without the leading @)
  twitter          : "junteng88716710"

# Publication categories used by the Publications collection
publication_category:
  preprints:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "master"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : true
  path                   :

# SEO and social profiles
# The GitHub profile image associated with the GitHub account recorded in memory.
og_image                 : "https://github.com/Vicent0205.png"
og_description           : "Junteng Liu's academic homepage, education, research experience, publications, skills, and contact information."
social:
  type                   : Person
  name                   : "Junteng Liu"
  links:
    - "mailto:jliugi@connect.ust.hk"
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://x.com/junteng88716710"

# Analytics are disabled because no analytics identifier is recorded in memory.
analytics:
  provider               : false
  google:
    tracking_id          :

# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README.md
  - tmp
  - vendor
  # Template-supplied sample content is retained in the forked repository but
  # excluded from this personalized site because no corresponding information
  # was recorded in memory.
  - files
  - _drafts
  - _posts
  - _talks
  - _teaching
  - _portfolio
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/portfolio.html
  - _pages/year-archive.html
  - _pages/archive-layout-with-content.md
  - _pages/non-menu-page.md
  - _pages/talkmap.html
  - _pages/terms.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/page-archive.html
  - _pages/tag-archive.html
  - _pages/sitemap.md
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Only the publications collection is used by this personalized site.
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  ignore:
    envs: development
