name: Publish Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-pages-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Build JavaScript bundle
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Publish generated site to gh-pages branch
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          git fetch origin gh-pages
          git worktree add ../pages-deploy gh-pages
          find ../pages-deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a _site/. ../pages-deploy/
          cd ../pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Junteng Liu homepage" || echo "No changes to commit"
          git push origin HEAD:gh-pages
